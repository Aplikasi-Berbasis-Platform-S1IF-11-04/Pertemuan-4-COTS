<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tambah Task</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    /* BACKGROUND */
    body{
      min-height:100vh;
      background: linear-gradient(-45deg,#0f172a,#1e293b,#111827,#1e1b4b);
      background-size:400% 400%;
      animation: gradientBG 15s ease infinite;
      overflow:hidden;
      position:relative;
      font-family:Arial, Helvetica, sans-serif;
    }

    @keyframes gradientBG {

      0%{
        background-position:0% 50%;
      }

      50%{
        background-position:100% 50%;
      }

      100%{
        background-position:0% 50%;
      }

    }

    /* FLOATING BALL */
    .bg-animation span{

      position:absolute;
      bottom:-150px;
      border-radius:50%;
      background:rgba(255,255,255,0.08);
      animation: float 25s linear infinite;

    }

    @keyframes float {

      0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
      }

      10%{
        opacity:1;
      }

      90%{
        opacity:0.7;
      }

      100%{
        transform:translateY(-1000px) rotate(720deg);
        opacity:0;
      }

    }

    .bg-animation span:nth-child(1){
      left:10%;
      width:80px;
      height:80px;
      animation-duration:18s;
    }

    .bg-animation span:nth-child(2){
      left:25%;
      width:120px;
      height:120px;
      animation-duration:25s;
    }

    .bg-animation span:nth-child(3){
      left:40%;
      width:60px;
      height:60px;
      animation-duration:15s;
    }

    .bg-animation span:nth-child(4){
      left:55%;
      width:150px;
      height:150px;
      animation-duration:22s;
    }

    .bg-animation span:nth-child(5){
      left:70%;
      width:90px;
      height:90px;
      animation-duration:17s;
    }

    .bg-animation span:nth-child(6){
      left:85%;
      width:110px;
      height:110px;
      animation-duration:30s;
    }

    /* FORM CARD */
    .glass-card{

      background: rgba(255,255,255,0.08);

      backdrop-filter: blur(15px);

      border:1px solid rgba(255,255,255,0.1);

      border-radius:25px;

      color:white;

      box-shadow:0 5px 15px rgba(0,0,0,0.2);

    }

    .form-control,
    .form-select{

      background:rgba(255,255,255,0.1);

      border:none;

      color:white;

    }

    .form-control:focus,
    .form-select:focus{

      background:rgba(255,255,255,0.15);

      color:white;

      box-shadow:none;

    }

    .form-control::placeholder{
      color:#ddd;
    }

    label{
      margin-bottom:8px;
      font-weight:bold;
    }

  </style>

</head>

<body>

<!-- BACKGROUND -->
<div class="bg-animation">

  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>

</div>

<div class="container py-5" style="position:relative; z-index:2;">

  <div class="glass-card p-4 mx-auto" style="max-width:650px;">

    <div class="text-center mb-4">

      <h1 class="fw-bold">
        Tambah Task
      </h1>

      <p>
        Tambahkan task baru ke dalam project manager
      </p>

    </div>

    <form id="formTambah">

      <div class="mb-3">

        <label>Judul Task</label>

        <input
          type="text"
          id="judul"
          class="form-control"
          placeholder="Masukkan judul task"
          required
        >

      </div>

      <div class="mb-3">

        <label>Prioritas</label>

        <select id="prioritas" class="form-select" required>

          <option value="">Pilih Prioritas</option>

          <option value="Tinggi">Tinggi</option>

          <option value="Sedang">Sedang</option>

          <option value="Rendah">Rendah</option>

        </select>

      </div>

      <div class="mb-3">

        <label>Deadline</label>

        <input
          type="date"
          id="deadline"
          class="form-control"
          required
        >

      </div>

      <div class="mb-4">

        <label>Status</label>

        <select id="status" class="form-select" required>

          <option value="Belum Mulai">Belum Mulai</option>

          <option value="Progress">Progress</option>

          <option value="Selesai">Selesai</option>

        </select>

      </div>

      <button
        type="submit"
        class="btn btn-warning w-100 fw-bold"
      >
        Simpan Task
      </button>

      <a
        href="index.html"
        class="btn btn-light w-100 mt-3 fw-bold"
      >
        Kembali
      </a>

    </form>

  </div>

</div>

<!-- JQUERY -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script>

$("#formTambah").submit(function(e){

  e.preventDefault();

  const payload = {

    judul: $("#judul").val(),
    prioritas: $("#prioritas").val(),
    deadline: $("#deadline").val(),
    status: $("#status").val()

  };

  $.ajax({

    url: "/api/tasks",

    type: "POST",

    contentType: "application/json",

    data: JSON.stringify(payload),

    success: function(res){

      alert(res.message);

      window.location.href = "index.html";

    }

  });

});

</script>

</body>
</html>
